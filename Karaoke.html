<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래방 일본곡 리스트</title>
<style>
  :root { --bg:#0f1220; --card:#181c30; --line:#262c47; --text:#e9ecf7; --sub:#9aa3c7; --acc:#ff6b9d; --acc2:#7c9cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:28px 20px 12px; text-align:center; }
  h1 { margin:0 0 6px; font-size:26px; }
  .sub { color:var(--sub); font-size:14px; }
  .wrap { max-width:860px; margin:0 auto; padding:0 16px 60px; }
  .search { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 0; }
  .search input { width:100%; padding:14px 16px; font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); outline:none; }
  .search input:focus { border-color:var(--acc); }
  .hint { color:var(--sub); font-size:12px; margin-top:6px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }
  .tab { padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--sub); cursor:pointer; font-size:14px; }
  .tab.on { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700; }
  .count { color:var(--sub); font-size:13px; margin:4px 0 10px; }
  .group { margin-bottom:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .group > summary { padding:12px 16px; cursor:pointer; font-weight:700; list-style:none; }
  .group > summary::after { content:"▾"; float:right; color:var(--sub); }
  .group[open] > summary::after { content:"▴"; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 16px; border-top:1px solid var(--line); }
  .no { min-width:58px; font-variant-numeric:tabular-nums; color:var(--acc2); font-weight:700; font-size:14px; }
  .title { flex:0 1 auto; min-width:120px; max-width:380px; font-size:15px; word-break:keep-all; }
  .kr { flex:1; color:var(--sub); font-size:13px; word-break:keep-all; }
  .comp { margin-left:auto; text-align:right; color:#c9b8ff; font-size:13px; max-width:45%; word-break:keep-all; }
  @media (max-width:540px){ .comp{width:100%;text-align:left;margin-left:0;max-width:none} }
  .tab.sort.on { background:var(--acc2); border-color:var(--acc2); }
  .badge { font-size:11px; padding:2px 8px; border-radius:6px; background:#2a3150; color:var(--sub); white-space:nowrap; }
  .empty { text-align:center; color:var(--sub); padding:40px 0; }
  mark { background:#ffd166; color:#111; border-radius:3px; }
  @media (max-width:540px){ .row{flex-wrap:wrap;gap:4px} .kr{width:100%} }
</style>
</head>
<body>
<header>
  <h1>🎤 노래방 일본곡 리스트</h1>

</header>
<div class="wrap">
  <div class="search">
    <input id="q" type="search" placeholder="번호, 곡명, 한글 독음 검색 (예: 호시아이, 45, Lemon)" autocomplete="off">
    <div class="hint">※ 일본어 곡명은 한글 독음으로도 검색됩니다. 예) ホシアイ → "호시아이"</div>

const CATS = { J:"J-POP", V:"보컬로이드" };
let cat = "ALL";
let sortNum = false;
const q = document.getElementById("q");
const list = document.getElementById("list");
const countEl = document.getElementById("count");

const norm = s => (s||"").toString().toLowerCase().replace(/[\s\.\-・、。,!！?？~〜'"＂「」『』()（）]/g,"");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = (text, term) => {
  if (!term) return esc(text);
  const i = text.toLowerCase().indexOf(term.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+term.length)) + "</mark>" + esc(text.slice(i+term.length));
};
const row = (s, term) => `<div class="row"><span class="no">${esc(s[0])}</span><span class="title">${hl(s[1], term)}</span><span class="kr">${hl(s[2], term)}</span><span class="comp">${esc(COMPOSER[s[0]] || "-")}</span></div>`;

function render() {
  const raw = q.value.trim();
  const term = norm(raw);
  let items = SONGS.filter(s => cat === "ALL" || s[3] === cat);
  if (term) {
    items = items.filter(s => norm(s[0]).includes(term) || norm(s[1]).includes(term) || norm(s[2]).includes(term) || norm(s[4]).includes(term));
  }
  const byNum = (a,b) => Number(a[0]) - Number(b[0]);
  countEl.textContent = `총 ${items.length}곡`;
  if (!items.length) { list.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`; return; }

  // 묶기 기준: J-POP 탭은 가수별, 나머지는 분류별. 정렬(번호순)은 묶음 안에서 항상 함께 적용됨.
  const order = cat === "ALL" ? ["J","V"] : [cat];
  const groups = order.map(g => ({ title: CATS[g], arr: items.filter(s => s[3] === g) })).filter(g => g.arr.length);
  list.innerHTML = groups.map(g => {
    const arr = sortNum ? [...g.arr].sort(byNum) : g.arr;
    return `<details class="group" open><summary>${esc(g.title)} <span class="badge">${arr.length}곡</span></summary>${arr.map(s=>row(s,raw)).join("")}</details>`;
  }).join("");
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); cat = b.dataset.cat; render();
}));
q.addEventListener("input", render);
document.getElementById("sortBtn").addEventListener("click", e => {
  sortNum = !sortNum;
  e.currentTarget.classList.toggle("on", sortNum);
  e.currentTarget.textContent = sortNum ? "🔢 번호순 정렬 ON" : "🔢 번호순 정렬";
  render();
});
render();
</script>
